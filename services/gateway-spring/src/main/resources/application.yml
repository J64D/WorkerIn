server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: workerin-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: workerin-api
              uri: ${API_URL:http://localhost:3000}
              predicates:
                - Path=/api/**
            - id: workerin-websocket-chat
              uri: ${REALTIME_URL:ws://localhost:8081}
              predicates:
                - Path=/ws/**
            - id: workerin-chat-history
              uri: ${REALTIME_HTTP_URL:http://realtime:8081}
              predicates:
                - Path=/chat/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
workerin:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4173}
