name: workerin
services:
  web:
    image: nginx:1.27-alpine
    ports: ["${WEB_PORT:-4173}:80"]
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [gateway]
    restart: unless-stopped

  gateway:
    build: ./services/gateway-spring
    environment:
      SERVER_PORT: 8080
      API_URL: http://api:3000
      REALTIME_URL: ws://realtime:8081
      RANKING_URL: http://ranking:8090
      ANALYTICS_URL: http://analytics:8091
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:8080}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_started }
      ranking: { condition: service_started }
      analytics: { condition: service_started }
    restart: unless-stopped

  api:
    build: ./services/api-node
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      MONGO_URL: mongodb://mongo:27017/workerin
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-workerin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-workerin-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-workerin-media}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MAPS_PROVIDER: ${MAPS_PROVIDER:-none}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      JAVA_RANKING_URL: http://ranking:8090
      SCALA_ANALYTICS_URL: http://analytics:8091
      DEMO_SEED: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:8080}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  realtime:
    build: ./services/realtime-go
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      REDIS_ADDR: redis:6379
      CASSANDRA_HOSTS: cassandra
      API_INTERNAL_URL: http://api:3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:8080}
    depends_on:
      redis: { condition: service_healthy }
      cassandra-init: { condition: service_completed_successfully }
      api: { condition: service_started }
    restart: unless-stopped

  ranking:
    build: ./services/ranking-java
    environment: { SERVER_PORT: 8090 }
    restart: unless-stopped

  analytics:
    build: ./services/analytics-scala
    environment:
      PORT: 8091
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: WorkerIN
    volumes: ["cassandra-data:/var/lib/cassandra"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'describe cluster' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra: { condition: service_healthy }
    volumes: ["./infra/cassandra/init.cql:/init.cql:ro"]
    entrypoint: ["/bin/bash", "-lc"]
    command: ["cqlsh cassandra 9042 -f /init.cql"]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-workerin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-workerin-local-secret}
    volumes: ["media-data:/data"]
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio: { condition: service_started }
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\"; do sleep 2; done; until mc ready local; do sleep 2; done; mc mb --ignore-existing local/$$MINIO_BUCKET && mc anonymous set download local/$$MINIO_BUCKET && mc cors set local/$$MINIO_BUCKET /cors.xml"]
    volumes: ["./infra/minio/cors.xml:/cors.xml:ro"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-workerin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-workerin-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-workerin-media}
    restart: "no"

volumes:
  mongo-data:
  redis-data:
  cassandra-data:
  elasticsearch-data:
  media-data:

